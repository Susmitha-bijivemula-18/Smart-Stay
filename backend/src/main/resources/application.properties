# StayNest Backend Configuration (PostgreSQL Cloud / Supabase)
spring.application.name=staynest-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Datasource Configuration (supports environment variable overrides)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db.ybvpmydjqtdoiehlidwj.supabase.co:5432/postgres}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Chakri@**0987}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Pool Settings
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.maximum-pool-size=5

# JPA / Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT Configuration
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expirationMs=86400000
jwt.jwtRefreshExpirationMs=2592000000

# App CORS Configuration (supports local dev and cloud Vercel deployments)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://*.vercel.app}

# AI Service Configuration (Render Python service endpoint)
app.ai-service-url=${AI_SERVICE_URL:http://localhost:5000}

# Server Configuration (Render dynamically injects $PORT)
server.port=${PORT:8081}
