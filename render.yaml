services:
  # 1. StayNest AI Service (Python / Flask)
  - type: web
    name: staynest-ai-service
    runtime: python
    rootDir: ai-service
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: FLASK_DEBUG
        value: "false"

  # 2. StayNest Backend (Java 17 / Spring Boot)
  - type: web
    name: staynest-backend
    runtime: java
    rootDir: backend
    plan: free
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -jar target/backend-0.0.1-SNAPSHOT.jar
    envVars:
      - key: CORS_ALLOWED_ORIGINS
        value: "https://*.vercel.app,http://localhost:5173"
      - key: AI_SERVICE_URL
        value: "https://staynest-ai-service.onrender.com"
